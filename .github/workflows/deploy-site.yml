name: Deploy Site to Cloudflare

on:
  push:
    tags:
      - 'site-v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract site version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#site-v}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'site/salmon/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: site/salmon
        run: pnpm install --frozen-lockfile

      - name: Build SvelteKit site
        working-directory: site/salmon
        run: pnpm run build
        env:
          PUBLIC_SITE_VERSION: ${{ steps.version.outputs.value }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site/salmon
          command: deploy

name: Release App

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  WAILS_VERSION: "v3.0.0-beta.20"   # pinned for reproducible builds

jobs:
  # ------------------------------------------------------------------
  # Desktop builds: Windows, Linux, macOS
  # ------------------------------------------------------------------
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            artifact_name: linux-packages
          - os: windows-latest
            platform: windows
            artifact_name: windows-installer
          - os: macos-latest
            platform: darwin
            artifact_name: macos-app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # --- Linux: Install and configure system dependencies ---
      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail

          sudo add-apt-repository --yes universe
          sudo apt-get update

          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            rpm \
            fakeroot \
            libwebkitgtk-6.0

          GTK_PC="$(dpkg -L libgtk-4-dev | grep -m1 '/gtk4.pc$')"
          WEBKIT_PC="$(dpkg -L libwebkitgtk-6.0-dev | grep -m1 '/webkitgtk-6.0.pc$')"

          test -f "$GTK_PC"
          test -f "$WEBKIT_PC"

          GTK_PC_DIR="$(dirname "$GTK_PC")"
          WEBKIT_PC_DIR="$(dirname "$WEBKIT_PC")"

          PKG_CONFIG_PATH="$GTK_PC_DIR:$WEBKIT_PC_DIR:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

          pkg-config --list-all | grep -E '^(gtk4|webkitgtk-6\.0)\s'
          pkg-config --modversion gtk4
          pkg-config --modversion webkitgtk-6.0

      # --- Windows: Install NSIS ---
      - name: Install NSIS (Windows only)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "C:\Program Files (x86)\NSIS\Bin\makensis.exe" /VERSION

      - name: Verify NSIS (Windows only)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          Get-Command makensis
          makensis /VERSION

      # --- Common build steps (all platforms) ---
      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Verify Wails version
        run: wails3 version

      - name: Install frontend dependencies
        working-directory: app/salmon/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app/salmon/frontend
        run: pnpm run build

      - name: Build & package desktop app
        working-directory: app/salmon
        run: wails3 package
        env:
          CGO_ENABLED: 1

      # --- Linux: Bundle WebKit libraries into AppImage ---
      - name: Bundle WebKit libraries in AppImage (Linux only)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail

          # Find the AppDir that wails3 created
          APPDIR=$(find app/salmon/bin -maxdepth 2 -name "*.AppDir" -type d | head -1)

          if [ -z "$APPDIR" ]; then
            echo "AppDir not found, attempting to create structure..."
            APPDIR="app/salmon/bin/Salmon.AppDir"
            mkdir -p "$APPDIR/usr/lib/x86_64-linux-gnu"
          fi

          echo "Using AppDir: $APPDIR"

          # Copy runtime WebKit libraries
          mkdir -p "$APPDIR/usr/lib/x86_64-linux-gnu"

          # Copy main WebKit libraries
          sudo cp -v /usr/lib/x86_64-linux-gnu/libwebkitgtk-6.0.so* "$APPDIR/usr/lib/x86_64-linux-gnu/" || true
          sudo cp -v /usr/lib/x86_64-linux-gnu/libgtk-4.so* "$APPDIR/usr/lib/x86_64-linux-gnu/" || true
          sudo cp -v /usr/lib/x86_64-linux-gnu/libgdk-4.so* "$APPDIR/usr/lib/x86_64-linux-gnu/" || true
          sudo cp -v /usr/lib/x86_64-linux-gnu/libglib-2.0.so* "$APPDIR/usr/lib/x86_64-linux-gnu/" || true
          sudo cp -v /usr/lib/x86_64-linux-gnu/libcairo.so* "$APPDIR/usr/lib/x86_64-linux-gnu/" || true
          sudo cp -v /usr/lib/x86_64-linux-gnu/libpango*.so* "$APPDIR/usr/lib/x86_64-linux-gnu/" || true

          # Copy WebKit subprocess (critical for WebKitGTK to work)
          sudo mkdir -p "$APPDIR/usr/lib/x86_64-linux-gnu/webkitgtk-6.0"
          sudo cp -rv /usr/lib/x86_64-linux-gnu/webkitgtk-6.0/* "$APPDIR/usr/lib/x86_64-linux-gnu/webkitgtk-6.0/" || true

          # Set library path in AppImage environment
          echo "Bundling complete"
          ls -la "$APPDIR/usr/lib/x86_64-linux-gnu/" | head -20

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            app/salmon/bin/*
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------
  # Android: AAB (Play Store) + APK (sideload)
  # ------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264'

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Verify Wails version
        run: wails3 version

      - name: Install frontend dependencies
        working-directory: app/salmon/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app/salmon/frontend
        run: pnpm run build

      - name: Build Android APK (fat)
        working-directory: app/salmon
        run: wails3 task android:package:fat
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build Android AAB (fat)
        working-directory: app/salmon
        run: wails3 task android:bundle:fat
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            app/salmon/bin/*.apk
            app/salmon/bin/*.aab
          retention-days: 7

  # ------------------------------------------------------------------
  # iOS: .ipa
  # ------------------------------------------------------------------
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Verify Wails version
        run: wails3 version

      - name: Install frontend dependencies
        working-directory: app/salmon/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app/salmon/frontend
        run: pnpm run build

      - name: Decode provisioning profile
        run: |
          mkdir -p $RUNNER_TEMP/profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode \
            > $RUNNER_TEMP/profiles/app.mobileprovision

      - name: Build iOS IPA
        working-directory: app/salmon
        run: |
          wails3 task ios:package:ipa \
            IOS_PLATFORM=device \
            CODESIGN_IDENTITY="${{ secrets.IOS_CODESIGN_IDENTITY }}" \
            PROVISIONING_PROFILE="$RUNNER_TEMP/profiles/app.mobileprovision"
        env:
          CGO_ENABLED: 1

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app/salmon/bin/*.ipa
          retention-days: 7

  # ------------------------------------------------------------------
  # Release
  # ------------------------------------------------------------------
  release:
    # needs: [build-desktop, build-android, build-ios]
    needs: [build-desktop]
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display collected files
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.app
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

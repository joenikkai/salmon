name: Release App

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  WAILS_VERSION: "v3.0.0-beta.20"

jobs:
  # ============================================================
  # Windows — native runner (NSIS + PE toolchain)
  # ============================================================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: app/salmon/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "C:\Program Files (x86)\NSIS\Bin\makensis.exe" /VERSION

      - name: Verify NSIS
        shell: powershell
        run: |
          Get-Command makensis
          makensis /VERSION

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Verify Wails version
        run: wails3 version

      - name: Install frontend dependencies
        working-directory: app/salmon/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app/salmon/frontend
        run: pnpm run build

      - name: Build & package Windows app
        working-directory: app/salmon
        run: wails3 package

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/salmon/bin/*.exe
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # macOS — native runner (Xcode, universal binary + DMG)
  # ============================================================
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: app/salmon/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Verify Wails version
        run: wails3 version

      - name: Install frontend dependencies
        working-directory: app/salmon/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app/salmon/frontend
        run: pnpm run build

      - name: Build macOS universal .app
        working-directory: app/salmon
        run: wails3 package

      - name: Create DMG from .app bundle
        working-directory: app/salmon/bin
        shell: bash
        run: |
          set -euxo pipefail
          
          APP_BUNDLE=$(find . -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::No .app bundle found in $(pwd)"
            ls -la
            exit 1
          fi
          
          APP_NAME=$(basename "$APP_BUNDLE" .app)
          DMG_NAME="${APP_NAME}.dmg"
          
          echo "Creating DMG: $DMG_NAME from $APP_BUNDLE"
          
          # Create DMG using hdiutil
          hdiutil create -volname "$APP_NAME" \
            -srcfolder "$APP_BUNDLE" \
            -ov -format UDZO \
            "$DMG_NAME"
          
          ls -lah *.dmg *.app 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            app/salmon/bin/*.app
            app/salmon/bin/*.dmg
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # Linux (Fedora) — Docker with WebKit GTK dependencies
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
      - name: Install Git
        run: dnf install -y git

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (Fedora)
        run: |
          dnf install -y \
            gcc gcc-c++ pkgconf-pkg-config \
            gtk4-devel webkitgtk6.0-devel \
            libayatana-appindicator-gtk3-devel \
            rpm-build fakeroot xorg-x11-server-Xvfb \
            go nodejs npm

      - name: Setup pnpm
        run: npm install -g pnpm@9

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Verify Wails version
        run: wails3 version

      - name: Install frontend dependencies
        working-directory: app/salmon/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app/salmon/frontend
        run: pnpm run build

      - name: Build & package Linux app (Fedora)
        working-directory: app/salmon
        shell: bash
        run: |
          set -euxo pipefail
          
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WEBKIT_DISABLE_SANDBOX=1
          
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' \
            wails3 package
        env:
          CGO_ENABLED: 1

      - name: Bundle WebKit libraries into AppImage
        working-directory: app/salmon
        shell: bash
        run: |
          set -euxo pipefail
          
          APPDIR=$(find bin -maxdepth 2 -name "*.AppDir" -type d | head -1)
          
          if [ -z "$APPDIR" ]; then
            echo "::error::AppDir not found"
            ls -la bin/
            exit 1
          fi
          
          echo "Using AppDir: $APPDIR"
          mkdir -p "$APPDIR/usr/lib64"
          
          # Copy WebKit libraries (Fedora uses lib64)
          cp -v /usr/lib64/libwebkitgtk-6.0.so* "$APPDIR/usr/lib64/" || true
          cp -v /usr/lib64/libgtk-4.so* "$APPDIR/usr/lib64/" || true
          cp -v /usr/lib64/libgdk-4.so* "$APPDIR/usr/lib64/" || true
          cp -v /usr/lib64/libglib-2.0.so* "$APPDIR/usr/lib64/" || true
          cp -v /usr/lib64/libcairo.so* "$APPDIR/usr/lib64/" || true
          cp -v /usr/lib64/libpango*.so* "$APPDIR/usr/lib64/" || true
          
          mkdir -p "$APPDIR/usr/lib64/webkitgtk-6.0"
          cp -rv /usr/lib64/webkitgtk-6.0/* "$APPDIR/usr/lib64/webkitgtk-6.0/" || true
          
          echo "WebKit bundling complete"
          ls -lah "$APPDIR/usr/lib64/" | head -20

      - name: Fix artifact ownership
        if: always()
        run: |
          chown -R 1000:1000 app/salmon/bin || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            app/salmon/bin/*.AppImage
            app/salmon/bin/*.deb
            app/salmon/bin/*.rpm
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # Android — Ubuntu native (Android SDK)
  # ============================================================
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: app/salmon/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264'

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Verify Wails version
        run: wails3 version

      - name: Install frontend dependencies
        working-directory: app/salmon/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app/salmon/frontend
        run: pnpm run build

      - name: Build Android APK (fat)
        working-directory: app/salmon
        run: wails3 task android:package:fat
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build Android AAB (fat)
        working-directory: app/salmon
        run: wails3 task android:bundle:fat
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            app/salmon/bin/*.apk
            app/salmon/bin/*.aab
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # iOS (optional, not required for release)
  # ============================================================
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Verify Wails version
        run: wails3 version

      - name: Install frontend dependencies
        working-directory: app/salmon/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app/salmon/frontend
        run: pnpm run build

      - name: Decode provisioning profile
        run: |
          mkdir -p $RUNNER_TEMP/profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode \
            > $RUNNER_TEMP/profiles/app.mobileprovision

      - name: Build iOS IPA
        working-directory: app/salmon
        run: |
          wails3 task ios:package:ipa \
            IOS_PLATFORM=device \
            CODESIGN_IDENTITY="${{ secrets.IOS_CODESIGN_IDENTITY }}" \
            PROVISIONING_PROFILE="$RUNNER_TEMP/profiles/app.mobileprovision"
        env:
          CGO_ENABLED: 1

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app/salmon/bin/*.ipa
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # Release — requires desktop builds (Windows, macOS, Linux)
  # ============================================================
  release:
    needs: [build-windows, build-macos, build-linux, build-android, build-ios]
    runs-on: ubuntu-24.04
    # Desktop builds (Windows, macOS, Linux) are required; Android is nice-to-have; iOS is optional
    if: |
      always() && (
        needs.build-windows.result == 'success' ||
        needs.build-macos.result == 'success' ||
        needs.build-linux.result == 'success'
      )

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display collected files
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.app
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release Wails App

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

# ---------- shared shim for the native runners ----------
# (Windows/macOS/iOS jobs still need it; the Docker images bake it in.)

jobs:
  # ============================================================
  # Windows — must be native (NSIS + Windows PE toolchain)
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache-dependency-path: app/salmon/go.sum }
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/salmon/frontend/pnpm-lock.yaml
      - name: npm → pnpm shim
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\shim"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          Set-Content -Path "$d\npm.cmd" -Value "@echo off`r`npnpm %*"
          Add-Content -Path $env:GITHUB_PATH -Value $d
      - name: Install Wails v3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Install NSIS
        run: |
          choco install nsis -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
      - name: Build NSIS installer
        working-directory: app/salmon
        run: wails3 task windows:create:nsis:installer
      - uses: actions/upload-artifact@v4
        with:
          name: salmon-windows-amd64
          path: app/salmon/bin/*.exe
          if-no-files-found: warn

  # ============================================================
  # macOS + iOS — must be native (Xcode)
  # ============================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache-dependency-path: app/salmon/go.sum }
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: app/salmon/frontend/pnpm-lock.yaml
      - name: npm → pnpm shim
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec pnpm "$@"\n' > "$HOME/.local/bin/npm"
          chmod +x "$HOME/.local/bin/npm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Build macOS universal .app
        working-directory: app/salmon
        run: wails3 task darwin:package:universal
      - uses: actions/upload-artifact@v4
        with:
          name: salmon-darwin-universal
          path: app/salmon/bin/*.app
          if-no-files-found: warn

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache-dependency-path: app/salmon/go.sum }
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: app/salmon/frontend/pnpm-lock.yaml
      - name: npm → pnpm shim
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec pnpm "$@"\n' > "$HOME/.local/bin/npm"
          chmod +x "$HOME/.local/bin/npm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Build iOS .app
        working-directory: app/salmon
        run: wails3 task ios:build
      - uses: actions/upload-artifact@v4
        with:
          name: salmon-ios
          path: app/salmon/bin/*.app
          if-no-files-found: warn

  # ============================================================
  # Linux — Docker per distro (Ubuntu for deb/appimage, Fedora for rpm)
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu, label: linux-amd64-deb,
              cmd: 'linux:create:deb',      path: 'app/salmon/bin/*.deb' }
          - { distro: ubuntu, label: linux-amd64-appimage,
              cmd: 'linux:create:appimage', path: 'app/salmon/bin/*.AppImage' }
          - { distro: fedora, label: linux-amd64-rpm,
              cmd: 'linux:create:rpm',      path: 'app/salmon/bin/*.rpm' }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Verify dockerfiles
        run: |
          ls -la app/salmon/build/docker
          head -n 20 app/salmon/docker/build/Dockerfile.${{ matrix.distro }}

      - uses: docker/setup-buildx-action@v3

      - name: Build builder image (${{ matrix.distro }})
        uses: docker/build-push-action@v6
        with:
          context: app/salmon
          file: app/salmon/build/docker/Dockerfile.${{ matrix.distro }}
          load: true
          tags: salmon-builder:${{ matrix.distro }}
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.distro }}

      - name: Build ${{ matrix.label }}
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src/app/salmon \
            salmon-builder:${{ matrix.distro }} \
            wails3 task ${{ matrix.cmd }}

      - name: Fix artifact ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" app/salmon/bin || true

      - uses: actions/upload-artifact@v4
        with:
          name: salmon-${{ matrix.label }}
          path: ${{ matrix.path }}
          if-no-files-found: warn

  # ============================================================
  # Android — native ubuntu (Android SDK action is the least painful path)
  # ============================================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache-dependency-path: app/salmon/go.sum }
      - uses: pnpm/action-setup@v4
        with: { version: 9, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: app/salmon/frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"        


      - name: npm → pnpm shim
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec pnpm "$@"\n' > "$HOME/.local/bin/npm"
          chmod +x "$HOME/.local/bin/npm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - name: Build Android AAB
        working-directory: app/salmon
        run: wails3 task android:bundle:fat
      - uses: actions/upload-artifact@v4
        with:
          name: salmon-android
          path: app/salmon/bin/*.aab
          if-no-files-found: warn

  # ============================================================
  # Release
  # ============================================================
  release:
    needs: [build-windows, build-macos, build-ios, build-linux, build-android]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/app-v') }}
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Prepare release files
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            label=$(basename "$d")
            for f in "$d"*; do
              [ -e "$f" ] || continue
              if [ -d "$f" ]; then
                ( cd "$(dirname "$f")" && zip -qr - "$(basename "$f")" ) \
                  > "release/${label}-$(basename "$f").zip"
              else
                cp "$f" "release/${label}-$(basename "$f")"
              fi
            done
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}


          

name: Release Wails App

on:
  push:
    tags:
      - 'app-v*'

      
env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'salmon'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'
            label: 'linux-amd64'
          - name: 'salmon'
            platform: 'windows/amd64'
            os: 'windows-latest'
            label: 'windows-amd64'
          - name: 'salmon'
            platform: 'darwin/universal'
            os: 'macos-latest'
            label: 'darwin-universal'
    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
        
      - name: Verify Wails CLI
        shell: bash
        run: |
          which -a wails  || echo "no wails v2 on PATH"
          which -a wails3 || echo "no wails3 on PATH"
          wails3 --version || true
          wails  --version || true

      - name: Build Wails v3 app
        shell: bash
        working-directory: app/salmon
        run: |
          if [ "${{ matrix.build.platform }}" = "darwin/universal" ]; then
            wails3 build -platform darwin/universal
          else
            wails3 build -platform ${{ matrix.build.platform }}
          fi

      - name: Debug build output
        shell: bash
        run: ls -la app/salmon/bin || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.name }}-${{ matrix.build.label }}
          path: app/salmon/bin/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            label=$(basename "$d")
            for f in "$d"*; do
              [ -f "$f" ] || continue
              cp "$f" "release/${label}-$(basename "$f")"
            done
          done
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
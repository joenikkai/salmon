name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  WAILS_VERSION: "v3.0.0-beta.20"   # pinned for reproducible builds

jobs:
  # ------------------------------------------------------------------
  # Desktop builds: Windows, Linux, macOS
  # ------------------------------------------------------------------
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: linux-packages
          - os: windows-latest
            platform: windows
            artifact_name: windows-installer
          - os: macos-latest
            platform: darwin
            artifact_name: macos-app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # ----- Linux: GTK4 + WebKitGTK 6.0 (Wails v3 default) -----
      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            rpm \
            fakeroot

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Verify Wails version
        run: wails3 version

      - name: Install frontend dependencies
        working-directory: app/salmon/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app/salmon/frontend
        run: pnpm run build

      - name: Build & package desktop app
        working-directory: app/salmon
        run: wails3 package
        env:
          CGO_ENABLED: 1

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            app/salmon/bin/*
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------
  # Android: AAB (Play Store) + APK (sideload)
  # ------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264'

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Verify Wails version
        run: wails3 version

      - name: Install frontend dependencies
        working-directory: app/salmon/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app/salmon/frontend
        run: pnpm run build

      - name: Build Android APK (fat)
        working-directory: app/salmon
        run: wails3 task android:package:fat
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build Android AAB (fat)
        working-directory: app/salmon
        run: wails3 task android:bundle:fat
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            app/salmon/bin/*.apk
            app/salmon/bin/*.aab
          retention-days: 7

  # ------------------------------------------------------------------
  # iOS: .ipa
  # ------------------------------------------------------------------
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Verify Wails version
        run: wails3 version

      - name: Install frontend dependencies
        working-directory: app/salmon/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app/salmon/frontend
        run: pnpm run build

      - name: Decode provisioning profile
        run: |
          mkdir -p $RUNNER_TEMP/profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode \
            > $RUNNER_TEMP/profiles/app.mobileprovision

      - name: Build iOS IPA
        working-directory: app/salmon
        run: |
          wails3 task ios:package:ipa \
            IOS_PLATFORM=device \
            CODESIGN_IDENTITY="${{ secrets.IOS_CODESIGN_IDENTITY }}" \
            PROVISIONING_PROFILE="$RUNNER_TEMP/profiles/app.mobileprovision"
        env:
          CGO_ENABLED: 1

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app/salmon/bin/*.ipa
          retention-days: 7

  # ------------------------------------------------------------------
  # Release
  # ------------------------------------------------------------------
  release:
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display collected files
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.app
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.apk
            artifacts/**/*.aab
            artifacts/**/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Wails Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0

env:
  NODE_OPTIONS: "--max-old-space-size=4096" # Prevents OOM during build[reference:1]

jobs:
  build:
    strategy:
      fail-fast: false # Continue building other platforms if one fails[reference:2]
      matrix:
        build:
          - name: 'salmon'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'
          - name: 'salmon'
            platform: 'windows/amd64'
            os: 'windows-latest'
          - name: 'salmon'
            platform: 'darwin/universal'
            os: 'macos-latest'
    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Wails app
        uses: dAppServer/wails-build-action@v2.2
        id: build
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          package: false # Keep the raw binaries; we'll create the release separately
          go-version: '1.20'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.name }}-${{ matrix.build.platform }}
          path: build/bin/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true